name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: getbyfarm }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/getbyfarm
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Dependency vulnerability audit
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: No model changes without a migration
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (PostgreSQL, includes the concurrent-oversell race test)
        run: python manage.py test integration_tests -v 2
      - name: Production-mode deploy audit
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
          DJANGO_ALLOWED_HOSTS: example.com
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/getbyfarm

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run build
        env: { NEXT_PUBLIC_API_URL: "" }

  contract:
    name: frontend ↔ backend contract
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: getbyfarm }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ci-only-secret-key-ci-only-secret-key-ci-only-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/getbyfarm
      THROTTLE_LOGIN: "1000/minute"                     # the e2e test logs in/registers far more than a human would
      THROTTLE_REGISTER: "1000/hour"
      ALLOW_MOCK_PAYMENTS: "true"                       # CI staging only: no real payments exist here
      I_UNDERSTAND_MOCK_PAYMENTS_ARE_FAKE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Start the API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate
          python manage.py createcachetable
          python manage.py seed_catalogue
          DJANGO_SUPERUSER_PASSWORD='Admin-CI-Pw-77!' python manage.py createsuperuser --noinput --email ops@ci.test --full_name Ops
          gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 2 --daemon
          sleep 4 && curl -fsS http://127.0.0.1:8000/api/health/
      - name: Run the contract test with the real frontend client code
        working-directory: frontend
        run: |
          npm ci
          NEXT_PUBLIC_API_URL=http://127.0.0.1:8000 E2E_ADMIN_EMAIL=ops@ci.test E2E_ADMIN_PASSWORD='Admin-CI-Pw-77!' npx tsx e2e/contract.js
